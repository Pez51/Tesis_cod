paths:
  raw_csv: "data/raw/datos_abiertos_vigilancia_edas_2000_2024.csv"
  geo_file: "data/geo/distritos_peru.geojson"
  processed_dir: "data/processed"
  models_dir: "models_saved"

data_processing:
  start_year: 2000
  end_year: 2024
  outbreak_percentile: 75
  features:
    - "ep_men5"
    - "hosp_men5"
    - "def_men5"
    - "ep_may5"
    - "hosp_may5"
    - "def_may5"
    - "delta_ep_men5"
    - "ratio_hosp_men5"
    - "sem_sin"
    - "sem_cos"
    - "roll_mean_4"
    - "surge_ratio"

model_params:
  seq_len: 8
  pred_horizon: 1
  target_idx: 0
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  batch_size: 32
  learning_rate: 0.001
  epochs: 100